<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — ACCESS DENIED | Aaron</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne+Mono&family=Barlow:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
    .err-code {
      font-family: var(--font-display); font-size: clamp(6rem,20vw,14rem);
      color: var(--red); line-height: 1;
      animation: glitch-skew 2s infinite; position: relative;
      letter-spacing: .05em;
    }
    .err-code::before, .err-code::after {
      content: '404'; position: absolute; top: 0; left: 0; width: 100%;
    }
    .err-code::before { color: var(--lime); animation: glitch-1 2s infinite; }
    .err-code::after  { color: var(--ice);  animation: glitch-2 1.5s infinite; }
    .err-title {
      font-family: var(--font-display); font-size: 1.8rem;
      color: var(--red); margin: 12px 0; letter-spacing: .15em;
    }
    .err-msg   { color: rgba(197,224,245,.65); margin-bottom: 40px; font-family: var(--font-body); }
    .terminal-block {
      background: var(--panel); border: 1px solid rgba(255,45,58,.3);
      border-radius: var(--radius-md); padding: 24px; display: inline-block;
      margin-bottom: 40px; font-family: var(--font-mono); font-size: .85rem; text-align: left;
    }
    .terminal-block .t-red   { color: var(--red); }
    .terminal-block .t-muted { color: var(--dim); }
  </style>
</head>
<body>
  <div id="c-dot"></div>
  <div id="c-ring"></div>

  <div>
    <div class="err-code">404</div>
    <div class="err-title">⚠ ACCESS DENIED ⚠</div>
    <p class="err-msg">The page you're looking for doesn't exist or was moved.</p>
    <div class="terminal-block">
      <div><span class="t-red">ERROR </span><span class="t-muted">: path not found in filesystem</span></div>
      <div><span class="t-red">STATUS</span><span class="t-muted">: 404 — Access attempt logged</span></div>
      <div><span class="t-red">TRACE </span><span class="t-muted">: returning to safe zone...</span></div>
    </div>
    <br/>
    <a href="index.html" class="btn btn-primary" style="display:inline-flex;">
      ← Return to Base
    </a>
  </div>

  <script>
    (function() {
      const dot  = document.getElementById('c-dot');
      const ring = document.getElementById('c-ring');
      if (!dot || !ring) return;
      let rx = 0, ry = 0, mx = 0, my = 0;
      document.addEventListener('mousemove', e => {
        mx = e.clientX; my = e.clientY;
        dot.style.left = mx + 'px'; dot.style.top = my + 'px';
      });
      const lerp = () => {
        rx += (mx - rx) * .1; ry += (my - ry) * .1;
        ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
        requestAnimationFrame(lerp);
      };
      lerp();
    })();
  </script>
</body>
</html>
